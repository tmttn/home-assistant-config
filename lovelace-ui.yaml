#- from github.com/tmttn/home-assistant-config
background: var(--background-image)
decluttering_templates:
  automation_template:
    card:
      card:
        show_header_toggle: false
        title: '[[name]] automations'
        type: entities
      filter:
        include:
        - entity_id: automation.[[slug]]*
      sort: entity_id
      type: custom:auto-entities
title: Huis
views:
- badges:
  - entity: person.tom
    show_entity_picture: true
    type: entity
  - entity: person.tanja
    show_entity_picture: true
    type: entity
  - entity: weather.home
    state_content:
    - state
    - temperature
    type: entity
  dense_section_placement: true
  header:
    badges_position: bottom
    card:
      content: '{%- set h = now().hour -%}

        {%- set zones = ["light.living_room_lights", "light.living_room_dining_table_lights",
        "light.living_room_middle_lights", "light.living_room_playing_corner_lights",
        "switch.hue_plug", "switch.shelly_kerstboom", "light.kitchen_lights", "light.upper_hall_lights",
        "light.outside_lights", "light.porch_light", "light.front_garden_light", "light.bedroom_lights",
        "light.bathroom_lights", "light.guest_bedroom_lights", "light.marthe_bedroom"]
        -%}

        {%- set lit = zones | select(''is_state'', ''on'') | list | count -%}

        {%- set doors = ["binary_sensor.openclose_front_door", "binary_sensor.openclose_back_door",
        "binary_sensor.openclose_living_room_door", "binary_sensor.openclose_storage_door"]
        -%}

        {%- set open = doors | select(''is_state'', ''on'') | list | count -%}

        {%- set alarm = states(''alarm_control_panel.bunderhome_alarm'') -%}

        # {{ ''Good morning'' if 5 <= h < 12 else ''Good afternoon'' if 12 <= h <
        18 else ''Good evening'' if 18 <= h < 23 else ''Good night'' }}

        {{ state_attr(''climate.living_room'', ''current_temperature'') | float(0)
        | round(1) }}° inside · {{ state_attr(''weather.home'', ''temperature'') |
        float(0) | round(0) | int }}° outside · {{ ''no lights on'' if lit == 0 else
        lit ~ ('' light'' if lit == 1 else '' lights'') ~ '' on'' }} · {{ ''all doors
        closed'' if open == 0 else open ~ ('' door'' if open == 1 else '' doors'')
        ~ '' open'' }} · alarm {{ ''off'' if alarm == ''disarmed'' else ''home'' if
        alarm == ''armed_home'' else ''away'' if alarm == ''armed_away'' else alarm
        | replace(''_'', '' '') }}'
      text_only: true
      type: markdown
    layout: responsive
  icon: mdi:home
  max_columns: 4
  path: default_view
  sections:
  - cards:
    - heading: Ground floor
      heading_style: title
      icon: mdi:home-floor-0
      type: heading
    - badges:
      - entity: climate.living_room
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      - color: red
        entity: binary_sensor.openclose_living_room_door
        show_state: true
        tap_action:
          action: more-info
        type: entity
        visibility:
        - condition: state
          entity: binary_sensor.openclose_living_room_door
          state: 'on'
      - icon: mdi:candle
        tap_action:
          action: perform-action
          perform_action: script.cozy_lights_living_room
        text: Cozy
        type: button
      - icon: mdi:white-balance-sunny
        tap_action:
          action: perform-action
          perform_action: script.white_lights_living_room
        text: White
        type: button
      heading: Living room
      heading_style: subtitle
      icon: mdi:sofa-outline
      type: heading
    - entity: light.living_room_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:lightbulb-group
      icon_tap_action:
        action: toggle
      name: All lights
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_dining_table_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:table-chair
      icon_tap_action:
        action: toggle
      name: Dining
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_middle_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light
      icon_tap_action:
        action: toggle
      name: Middle
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_playing_corner_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:toy-brick-outline
      icon_tap_action:
        action: toggle
      name: Corner
      tap_action:
        action: toggle
      type: tile
    - entity: switch.hue_plug
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:floor-lamp
      icon_tap_action:
        action: toggle
      name: Reading
      tap_action:
        action: toggle
      type: tile
    - entity: switch.shelly_kerstboom
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:pine-tree
      icon_tap_action:
        action: toggle
      name: Tree
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.kitchen
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      - color: red
        entity: binary_sensor.openclose_back_door
        show_state: true
        tap_action:
          action: more-info
        type: entity
        visibility:
        - condition: state
          entity: binary_sensor.openclose_back_door
          state: 'on'
      heading: Kitchen
      heading_style: subtitle
      icon: mdi:countertop-outline
      type: heading
    - entity: light.kitchen_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light-multiple
      icon_tap_action:
        action: toggle
      name: Lights
      tap_action:
        action: toggle
      type: tile
    - entity: switch.espresso_machine
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      icon: mdi:coffee-maker
      name: Espresso
      state_content:
      - state
      - last_changed
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.hall
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      - color: red
        entity: binary_sensor.openclose_front_door
        show_state: true
        tap_action:
          action: more-info
        type: entity
        visibility:
        - condition: state
          entity: binary_sensor.openclose_front_door
          state: 'on'
      heading: Hall
      heading_style: subtitle
      icon: mdi:door
      type: heading
    - entity: light.upper_hall_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light-multiple
      icon_tap_action:
        action: toggle
      name: Lights
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.storage
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      - color: red
        entity: binary_sensor.openclose_storage_door
        show_state: true
        tap_action:
          action: more-info
        type: entity
        visibility:
        - condition: state
          entity: binary_sensor.openclose_storage_door
          state: 'on'
      heading: Storage
      heading_style: subtitle
      icon: mdi:archive-outline
      type: heading
    - badges:
      - entity: weather.home
        show_icon: true
        state_content: temperature
        type: entity
      heading: Outside
      heading_style: subtitle
      icon: mdi:tree-outline
      type: heading
    - entity: light.outside_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:outdoor-lamp
      icon_tap_action:
        action: toggle
      name: Terrace
      tap_action:
        action: toggle
      type: tile
    - entity: light.porch_light
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:coach-lamp
      icon_tap_action:
        action: toggle
      name: Porch
      tap_action:
        action: toggle
      type: tile
    - entity: light.front_garden_light
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:post-lamp
      icon_tap_action:
        action: toggle
      name: Garden
      tap_action:
        action: toggle
      type: tile
    type: grid
  - cards:
    - heading: First floor
      heading_style: title
      icon: mdi:home-floor-1
      type: heading
    - badges:
      - entity: climate.bedroom
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      heading: Bedroom
      heading_style: subtitle
      icon: mdi:bed-outline
      type: heading
    - entity: light.bedroom_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:lightbulb-group
      icon_tap_action:
        action: toggle
      name: All lights
      tap_action:
        action: toggle
      type: tile
    - entity: light.bedroom_ceiling_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light
      icon_tap_action:
        action: toggle
      name: Ceiling
      tap_action:
        action: toggle
      type: tile
    - entity: light.bedroom_bedside_tom
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:lamp
      icon_tap_action:
        action: toggle
      name: Bedside
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.bathroom
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      heading: Bathroom
      heading_style: subtitle
      icon: mdi:shower
      type: heading
    - entity: light.bathroom_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light-multiple
      icon_tap_action:
        action: toggle
      name: Lights
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.guest_bedroom
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      heading: Guest room
      heading_style: subtitle
      icon: mdi:bed-single-outline
      type: heading
    - entity: light.guest_bedroom_lights
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:lightbulb-group
      icon_tap_action:
        action: toggle
      name: All lights
      tap_action:
        action: toggle
      type: tile
    - entity: light.guest_bedroom_bed_reading
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:lamp
      icon_tap_action:
        action: toggle
      name: Bedside
      tap_action:
        action: toggle
      type: tile
    - badges:
      - entity: climate.bedroom_marthe
        show_icon: false
        state_content: current_temperature
        tap_action:
          action: more-info
        type: entity
      heading: Marthe
      heading_style: subtitle
      icon: mdi:teddy-bear
      type: heading
    - entity: light.marthe_bedroom
      grid_options:
        columns: 6
      hide_state: true
      hold_action:
        action: more-info
      icon: mdi:ceiling-light
      icon_tap_action:
        action: toggle
      name: Lights
      tap_action:
        action: toggle
      type: tile
    type: grid
  - cards:
    - badges:
      - color: state
        entity: input_boolean.vacation_mode
        hold_action:
          action: more-info
        icon: mdi:palm-tree
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        type: entity
      - color: state
        entity: input_boolean.guest_mode
        hold_action:
          action: more-info
        icon: mdi:account-multiple
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        type: entity
      - color: state
        entity: input_boolean.automatic_temperature
        hold_action:
          action: more-info
        icon: mdi:thermostat-auto
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        type: entity
      heading: Home
      heading_style: title
      icon: mdi:home-account
      type: heading
    - color: amber
      grid_options:
        columns: 6
      icon: mdi:weather-sunset-up
      label: Wake up
      tap_action:
        action: perform-action
        data:
          option: 'off'
        perform_action: input_select.select_option
        target:
          entity_id: input_select.sleep_mode
      type: shortcut
    - color: indigo
      grid_options:
        columns: 6
      icon: mdi:weather-night
      label: Go to sleep
      tap_action:
        action: perform-action
        perform_action: script.going_to_sleep
      type: shortcut
    - color: green
      grid_options:
        columns: 6
      icon: mdi:home-map-marker
      label: Arrive home
      tap_action:
        action: perform-action
        perform_action: script.arriving
      type: shortcut
    - color: orange
      grid_options:
        columns: 6
      icon: mdi:home-export-outline
      label: Leave home
      tap_action:
        action: perform-action
        perform_action: script.leaving
      type: shortcut
    - color: red
      grid_options:
        columns: 12
      icon: mdi:power
      label: Everything off
      tap_action:
        action: perform-action
        perform_action: script.turn_off_everything_non_automatic
      type: shortcut
    - entity: input_select.sleep_mode
      features:
      - type: select-options
      features_position: inline
      grid_options:
        columns: 12
      hide_state: true
      name: Sleep mode
      type: tile
    - badges:
      - icon: mdi:thermometer-low
        tap_action:
          action: perform-action
          perform_action: script.set_low_temperature
        text: Low
        type: button
      - icon: mdi:thermometer
        tap_action:
          action: perform-action
          perform_action: script.set_moderate_temperature
        text: Mid
        type: button
      - icon: mdi:thermometer-high
        tap_action:
          action: perform-action
          perform_action: script.set_high_temperature
        text: High
        type: button
      heading: Heating
      heading_style: subtitle
      icon: mdi:radiator
      type: heading
    - badges:
      - icon: mdi:restore
        tap_action:
          action: perform-action
          perform_action: script.reset_adaptive_lighting
        text: Reset
        type: button
      heading: Manually controlled lights
      heading_style: subtitle
      icon: mdi:hand-back-right-outline
      type: heading
      visibility:
      - condition: template
        value_template: '{{ ((state_attr(''switch.adaptive_lighting_default'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_full'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_dim'', ''manual_control'')
          or [])) | count > 0 }}'
    - content: '{% set manual = (state_attr(''switch.adaptive_lighting_default'',
        ''manual_control'') or []) + (state_attr(''switch.adaptive_lighting_half_and_full'',
        ''manual_control'') or []) + (state_attr(''switch.adaptive_lighting_half_and_dim'',
        ''manual_control'') or []) %}{{ manual | join('', '') }}'
      text_only: true
      type: markdown
      visibility:
      - condition: template
        value_template: '{{ ((state_attr(''switch.adaptive_lighting_default'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_full'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_dim'', ''manual_control'')
          or [])) | count > 0 }}'
    - heading: Schedule
      heading_style: subtitle
      icon: mdi:calendar-clock
      type: heading
    - color: amber
      entity: sensor.limburg_net_morgen
      grid_options:
        columns: 12
      icon: mdi:trash-can
      name: Trash tomorrow
      type: tile
      visibility:
      - condition: state
        entity: sensor.limburg_net_morgen
        state_not: Geen
    - content: "{%- set today = now().date() -%}\n{%- set ns = namespace(rows=[],\
        \ bins=[]) -%}\n{%- set alarm = 'schedule.alarm_clock_schedule' -%}\n{%- set\
        \ next = state_attr(alarm, 'next_event') -%}\n{%- if is_state(alarm, 'on')\
        \ -%}\n  {%- set ns.rows = ns.rows + [('Now', 'Alarm')] -%}\n{%- elif next\
        \ -%}\n  {%- set a = as_local(as_datetime(next)) -%}\n  {%- set n = (a.date()\
        \ - today).days -%}\n  {%- set d = 'Today' if n == 0 else 'Tomorrow' if n\
        \ == 1 else a.strftime('%a %-d %b') -%}\n  {%- set ns.rows = ns.rows + [(d\
        \ ~ ' ' ~ a.strftime('%H:%M'), 'Alarm')] -%}\n{%- endif -%}\n{%- for name,\
        \ e in [('Papier', 'sensor.limburg_net_papier'), ('GFT', 'sensor.limburg_net_gft'),\
        \ ('PMD', 'sensor.limburg_net_pmd'), ('Restafval', 'sensor.limburg_net_restafval')]\
        \ -%}\n  {%- if state_attr(e, 'Sort_date') -%}\n    {%- set ns.bins = ns.bins\
        \ + [{'date': state_attr(e, 'Sort_date') | string, 'name': name}] -%}\n  {%-\
        \ endif -%}\n{%- endfor -%}\n{%- for g in ns.bins | groupby('date') -%}\n\
        \  {%- set t = strptime(g.grouper, '%Y%m%d') -%}\n  {%- set n = (t.date()\
        \ - today).days -%}\n  {%- set d = 'Today' if n == 0 else 'Tomorrow' if n\
        \ == 1 else t.strftime('%a %-d %b') -%}\n  {%- set ns.rows = ns.rows + [(d,\
        \ g.list | map(attribute='name') | join(', '))] -%}\n{%- endfor -%}\n<table\
        \ role=\"presentation\">\n{%- for d, what in ns.rows %}\n<tr><td><b>{{ d }}</b>&emsp;</td><td>{{\
        \ what }}</td></tr>\n{%- endfor %}\n</table>\n"
      grid_options:
        columns: full
      type: markdown
    - heading: Devices
      heading_style: title
      icon: mdi:devices
      type: heading
    - entity: sensor.bizzylectric_battery
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      icon: mdi:car-electric
      icon_tap_action:
        action: navigate
        navigation_path: /lovelace/car
      name: Bizzylectric
      tap_action:
        action: navigate
        navigation_path: /lovelace/car
      type: tile
    - entity: vacuum.robot_vacuum
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      icon_tap_action:
        action: navigate
        navigation_path: /lovelace/vacuum
      name: Vacuum
      state_content: status
      tap_action:
        action: navigate
        navigation_path: /lovelace/vacuum
      type: tile
    - color: red
      entity: binary_sensor.robot_vacuum_water_shortage
      grid_options:
        columns: 12
      icon: mdi:water-alert
      name: Water tank empty
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.robot_vacuum_water_shortage
        state: 'on'
    - entity: binary_sensor.washing_machine
      grid_options:
        columns: 12
      name: Washer
      state_content:
      - state
      - last_changed
      type: tile
    - entity: sensor.washing_machine_remaining_time
      grid_options:
        columns: 12
      icon: mdi:timer-sand
      name: Washer remaining
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.washing_machine
        state: 'on'
    type: grid
  - cards:
    - heading: Security
      heading_style: title
      icon: mdi:shield-home-outline
      type: heading
    - entity: alarm_control_panel.bunderhome_alarm
      features:
      - modes:
        - armed_home
        - armed_away
        - disarmed
        type: alarm-modes
      grid_options:
        columns: 12
      name: Alarm
      type: tile
    - content: '{%- set doors = [["binary_sensor.openclose_front_door", "Front door"],
        ["binary_sensor.openclose_back_door", "Back door"], ["binary_sensor.openclose_living_room_door",
        "Living room door"], ["binary_sensor.openclose_storage_door", "Storage door"]]
        -%}

        {%- set open = doors | selectattr(0, ''is_state'', ''on'') | map(attribute=1)
        | list -%}

        {{ ''All doors closed'' if not open else (open | join('', '')) ~ '' open''
        }}'
      grid_options:
        columns: full
      text_only: true
      type: markdown
    - camera_view: auto
      entity: camera.front_door_snapshot
      grid_options:
        columns: 4
        rows: 2
      name: Door
      show_state: false
      type: picture-entity
    - camera_view: auto
      entity: camera.front_garden_snapshot
      grid_options:
        columns: 4
        rows: 2
      name: Garden
      show_state: false
      type: picture-entity
    - camera_view: auto
      entity: camera.porch_snapshot
      grid_options:
        columns: 4
        rows: 2
      name: Porch
      show_state: false
      type: picture-entity
    - badges:
      - entity: sensor.energy_production_today
        icon: mdi:weather-sunny
        name: Forecast today
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      - entity: sensor.energy_production_tomorrow
        icon: mdi:weather-partly-cloudy
        name: Tomorrow
        show_icon: true
        show_name: true
        show_state: true
        type: entity
      heading: Energy
      heading_style: title
      icon: mdi:lightning-bolt-outline
      tap_action:
        action: navigate
        navigation_path: /energy
      type: heading
    - color: amber
      entity: sensor.sb3_0_1av_41_570_pv_power
      features:
      - hours_to_show: 24
        type: trend-graph
      features_position: inline
      grid_options:
        columns: 12
      icon: mdi:solar-power
      name: Solar
      type: tile
    - entity: sensor.p1_meter_active_power
      features:
      - hours_to_show: 24
        type: trend-graph
      features_position: inline
      grid_options:
        columns: 12
      icon: mdi:transmission-tower
      name: Grid (− = export)
      type: tile
    - content: '{%- set today = states(''sensor.daily_power_cost'') | float(0) + states(''sensor.daily_gas_cost'')
        | float(0) + states(''sensor.daily_energy_fixed_cost'') | float(0) -%}

        {%- set month = states(''sensor.monthly_power_cost'') | float(0) + states(''sensor.monthly_gas_cost'')
        | float(0) + states(''sensor.monthly_energy_fixed_cost'') | float(0) -%}

