        + states(''sensor.monthly_gas_cost_last_period'') | float(0) + states(''sensor.monthly_energy_fixed_cost_last_period'')
        | float(0) -%}

        **€{{ ''%.2f'' | format(today) }}** today · **€{{ ''%.2f'' | format(month)
        }}** in {{ now().strftime(''%B'') }} · €{{ ''%.2f'' | format(last) }} last
        month'
      grid_options:
        columns: full
      text_only: true
      type: markdown
