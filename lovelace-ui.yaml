  icon: mdi:robot
  layout:
    max_cols: 7
  path: automations
  theme: Metro Blue
  title: Automations
  type: custom:masonry-layout
- back_path: /lovelace/default_view
  icon: mdi:car-electric
  max_columns: 2
  path: car
  sections:
  - cards:
    - badges:
      - entity: sensor.bizzylectric_ideal_battery_range
        show_icon: true
        show_state: true
        type: entity
      - entity: device_tracker.bizzylectric_location
        show_icon: true
        show_state: true
        type: entity
      heading: Bizzylectric
      heading_style: title
      icon: mdi:car-electric
      type: heading
    - entity: sensor.bizzylectric_battery_level
      features:
      - max: 100
        min: 0
        type: bar-gauge
      grid_options:
        columns: 6
      name: Battery
      type: tile
    - entity: sensor.bizzylectric_charger_power
      features:
      - hours_to_show: 24
        type: trend-graph
      grid_options:
        columns: 6
      icon: mdi:ev-station
      name: Charging
      type: tile
    - entity: switch.bizzylectric_charge
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Charger
      tap_action:
        action: toggle
      type: tile
    - entity: input_boolean.ev_smart_charging
      grid_options:
        columns: 6
      icon: mdi:solar-power
      name: Smart charge
      tap_action:
        action: toggle
      type: tile
    - entity: input_select.ev_charging_session
      grid_options:
        columns: 6
      name: Session
      tap_action:
        action: more-info
      type: tile
      visibility:
      - condition: state
        entity: input_boolean.ev_smart_charging
        state: 'on'
    - entity: input_boolean.ev_charge_full_now
      grid_options:
        columns: 6
      icon: mdi:battery-charging-high
      name: Charge full
      tap_action:
        action: toggle
      type: tile
    - entity: number.bizzylectric_charge_current
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
      name: Amps
      type: tile
      visibility:
      - condition: state
        entity: switch.bizzylectric_charge
        state: 'on'
    - entity: number.bizzylectric_charge_limit
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
      name: Limit
      type: tile
    - entity: lock.bizzylectric_lock
      grid_options:
        columns: 6
      icon_tap_action:
        action: more-info
      name: Doors
      tap_action:
        action: more-info
      type: tile
    type: grid
  subview: true
  title: Bizzylectric
  type: sections
- back_path: /lovelace/default_view
  icon: mdi:robot-vacuum
  max_columns: 2
  path: vacuum
  sections:
  - cards:
    - badges:
      - entity: sensor.living_room_robot_vacuum_battery
        show_icon: true
        show_state: true
        type: entity
      - color: state
        entity: binary_sensor.vacuum_day
        show_icon: true
        show_state: true
        type: entity
      - color: state
        entity: input_boolean.cleaned_today
        hold_action:
          action: more-info
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        type: entity
      heading: Vacuum
      heading_style: title
      icon: mdi:robot-vacuum
      type: heading
    - entity: vacuum.robot_vacuum
      features:
      - commands:
        - start_pause
        - stop
        - return_home
        - locate
        type: vacuum-commands
      grid_options:
        columns: 12
      name: Vacuum
      state_content:
      - state
      - status
      type: tile
    - color: red
      entity: binary_sensor.robot_vacuum_water_shortage
      grid_options:
        columns: 12
      icon: mdi:water-alert
      name: Water tank empty
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.robot_vacuum_water_shortage
        state: 'on'
    - heading: Maintenance
      heading_style: subtitle
      icon: mdi:wrench-outline
      type: heading
    - entity: sensor.robot_vacuum_filter_left
      grid_options:
        columns: 6
      name: Filter
      type: tile
    - entity: sensor.robot_vacuum_main_brush_left
      grid_options:
        columns: 6
      name: Main brush
      type: tile
