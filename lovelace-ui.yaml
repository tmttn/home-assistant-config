  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Vacation mode
    - slug: vacation_mode
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Vacuum
    - slug: vacuum
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Work
    - slug: work
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Adaptive Lighting
    - slug: adaptive_lighting_
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Curtains
    - slug: curtains_
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Doorbell
    - slug: doorbell_
  - template: automation_template
