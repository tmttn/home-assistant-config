#- from github.com/tmttn/home-assistant-config
background: var(--background-image)
decluttering_templates:
  automation_template:
    card:
      card:
        show_header_toggle: false
        title: '[[name]] automations'
        type: entities
      filter:
        include:
        - entity_id: automation.[[slug]]*
      sort: entity_id
      type: custom:auto-entities
title: Huis
views:
- badges:
  - entity: person.tom
    show_entity_picture: true
    type: entity
  - entity: person.tanja
    show_entity_picture: true
    type: entity
  - entity: alarm_control_panel.bunderhome_alarm
    show_name: false
    type: entity
  - color: amber
    entity: sensor.sb3_0_1av_41_570_pv_power
    name: Solar
    show_name: true
    type: entity
  - entity: sensor.p1_meter_active_power
    name: Grid
    show_name: true
    type: entity
  - entity: sensor.bizzylectric_battery
    name: Tesla
    show_name: true
    type: entity
  - entity: weather.home
    state_content:
    - state
    - temperature
    type: entity
  icon: mdi:home
  max_columns: 4
  path: default_view
  sections:
  - cards:
    - heading: Modes
      heading_style: title
      icon: mdi:home-account
      type: heading
    - color: amber
      grid_options:
        columns: 6
      icon: mdi:weather-sunset-up
      label: Wake up
      tap_action:
        action: perform-action
        data:
          option: 'off'
        perform_action: input_select.select_option
        target:
          entity_id: input_select.sleep_mode
      type: shortcut
    - color: indigo
      grid_options:
        columns: 6
      icon: mdi:weather-night
      label: Go to sleep
      tap_action:
        action: perform-action
        perform_action: script.going_to_sleep
      type: shortcut
    - color: green
      grid_options:
        columns: 6
      icon: mdi:home-map-marker
      label: Arrive home
      tap_action:
        action: perform-action
        perform_action: script.arriving
      type: shortcut
    - color: orange
      grid_options:
        columns: 6
      icon: mdi:home-export-outline
      label: Leave home
      tap_action:
        action: perform-action
        perform_action: script.leaving
      type: shortcut
    - entity: input_select.sleep_mode
      features:
      - type: select-options
      grid_options:
        columns: 12
      name: Sleep mode
      type: tile
    - entity: input_boolean.vacation_mode
      grid_options:
        columns: 4
      hold_action:
        action: more-info
      name: Vacation
      tap_action:
        action: toggle
      type: tile
    - entity: input_boolean.guest_mode
      grid_options:
        columns: 4
      hold_action:
        action: more-info
      name: Guests
      tap_action:
        action: toggle
      type: tile
    - entity: input_boolean.automatic_temperature
      grid_options:
        columns: 4
      hold_action:
        action: more-info
      name: Auto temp
      tap_action:
        action: toggle
      type: tile
    type: grid
  - cards:
    - badges:
      - icon: mdi:restore
        tap_action:
          action: perform-action
          perform_action: script.reset_adaptive_lighting
        text: Reset adaptive
        type: button
      heading: Lights
      heading_style: title
      icon: mdi:lightbulb-group
      type: heading
    - content: '{% set manual = (state_attr(''switch.adaptive_lighting_default'',
        ''manual_control'') or []) + (state_attr(''switch.adaptive_lighting_half_and_full'',
        ''manual_control'') or []) + (state_attr(''switch.adaptive_lighting_half_and_dim'',
        ''manual_control'') or []) %}✋ Manually controlled: {{ manual | join('', '')
        }}'
      text_only: true
      type: markdown
      visibility:
      - condition: template
        value_template: '{{ ((state_attr(''switch.adaptive_lighting_default'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_full'', ''manual_control'')
          or []) + (state_attr(''switch.adaptive_lighting_half_and_dim'', ''manual_control'')
          or [])) | count > 0 }}'
    - badges:
      - icon: mdi:candle
        tap_action:
          action: perform-action
          perform_action: script.cozy_lights_living_room
        text: Cozy
        type: button
      - icon: mdi:white-balance-sunny
        tap_action:
          action: perform-action
          perform_action: script.white_lights_living_room
        text: White
        type: button
      heading: Living room
      heading_style: subtitle
      icon: mdi:sofa
      type: heading
    - entity: light.living_room_lights
      features:
      - type: light-brightness
      grid_options:
        columns: 12
      hold_action:
        action: more-info
      name: All living room
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_playing_corner_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Playing corner
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_dining_table_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Dining table
      tap_action:
        action: toggle
      type: tile
    - entity: light.living_room_middle_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Middle
      tap_action:
        action: toggle
      type: tile
    - entity: switch.hue_plug
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      icon: mdi:floor-lamp
      name: Reading lamp
      tap_action:
        action: toggle
      type: tile
    - entity: switch.shelly_kerstboom
      grid_options:
        columns: 12
      hold_action:
        action: more-info
      icon: mdi:string-lights
      name: Christmas tree
      tap_action:
        action: toggle
      type: tile
    - heading: Rooms
      heading_style: subtitle
      type: heading
    - entity: light.upper_hall_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Hall
      tap_action:
        action: toggle
      type: tile
    - entity: light.bathroom_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Bathroom
      tap_action:
        action: toggle
      type: tile
    - entity: light.bedroom_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Bedroom
      tap_action:
        action: toggle
      type: tile
    - entity: light.bedroom_ceiling_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Bedroom ceiling
      tap_action:
        action: toggle
      type: tile
    - entity: light.bedroom_bedside_tom
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Bedside Tom
      tap_action:
        action: toggle
      type: tile
    - entity: light.guest_bedroom_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Guest bedroom
      tap_action:
        action: toggle
      type: tile
    - entity: light.guest_bedroom_bedside
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Guest bedside
      tap_action:
        action: toggle
      type: tile
    - entity: light.kitchen_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Kitchen
      tap_action:
        action: toggle
      type: tile
    - entity: light.toilet
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Toilet
      tap_action:
        action: toggle
      type: tile
    - entity: light.automatic_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Automatic
      tap_action:
        action: toggle
      type: tile
    - entity: light.outside_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Outside
      tap_action:
        action: toggle
      type: tile
    - entity: light.terrace_lights
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Terrace
      tap_action:
        action: toggle
      type: tile
    type: grid
  - cards:
    - badges:
      - icon: mdi:thermometer-low
        tap_action:
          action: perform-action
          perform_action: script.set_low_temperature
        text: Low
        type: button
      - icon: mdi:thermometer
        tap_action:
          action: perform-action
          perform_action: script.set_moderate_temperature
        text: Moderate
        type: button
      - icon: mdi:thermometer-high
        tap_action:
          action: perform-action
          perform_action: script.set_high_temperature
        text: High
        type: button
      heading: Climate
      heading_style: title
      icon: mdi:thermostat
      type: heading
    - entity: climate.living_room
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:sofa
      name: Living room
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.kitchen
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:stove
      name: Kitchen
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.bathroom
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:shower
      name: Bathroom
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.bedroom
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:bed
      name: Bedroom
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.hall
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:stairs
      name: Hall
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.bedroom_marthe
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:baby-face-outline
      name: Marthe
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.guest_bedroom
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:bed-outline
      name: Guest bedroom
      state_content:
      - state
      - current_temperature
      type: tile
    - entity: climate.storage
      features:
      - type: target-temperature
      grid_options:
        columns: 6
      icon: mdi:archive
      name: Storage
      state_content:
      - state
      - current_temperature
      type: tile
    type: grid
  - cards:
    - heading: Energy
      heading_style: title
      icon: mdi:lightning-bolt
      tap_action:
        action: navigate
        navigation_path: /energy
      type: heading
    - entity: sensor.p1_meter_active_power
      features:
      - hours_to_show: 24
        type: trend-graph
      grid_options:
        columns: 6
      icon: mdi:transmission-tower
      name: Grid (− = export)
      type: tile
    - color: amber
      entity: sensor.sb3_0_1av_41_570_pv_power
      features:
      - hours_to_show: 24
        type: trend-graph
      grid_options:
        columns: 6
      icon: mdi:solar-power
      name: Solar
      type: tile
    - entity: sensor.sb3_0_1av_41_570_daily_yield
      grid_options:
        columns: 6
      icon: mdi:solar-power-variant
      name: Solar today
      type: tile
    - entity: sensor.energy_production_today
      grid_options:
        columns: 6
      icon: mdi:weather-partly-cloudy
      name: Forecast today
      type: tile
    - grid_options:
        columns: full
      type: energy-distribution
    - content: '{%- macro eur(e) -%}€{{ ''%.2f'' | format(states(e) | float(0)) }}{%-
        endmacro -%}

        {%- macro total(p, g, f) -%}€{{ ''%.2f'' | format(states(p) | float(0) + states(g)
        | float(0) + states(f) | float(0)) }}{%- endmacro -%}

        | | Today | {{ now().strftime(''%B'') }} | Last month |

        |:--|--:|--:|--:|

        | Power | {{ eur(''sensor.daily_power_cost'') }} | {{ eur(''sensor.monthly_power_cost'')
        }} | {{ eur(''sensor.monthly_power_cost_last_period'') }} |

        | Gas | {{ eur(''sensor.daily_gas_cost'') }} | {{ eur(''sensor.monthly_gas_cost'')
        }} | {{ eur(''sensor.monthly_gas_cost_last_period'') }} |

        | Fixed | {{ eur(''sensor.daily_energy_fixed_cost'') }} | {{ eur(''sensor.monthly_energy_fixed_cost'')
        }} | {{ eur(''sensor.monthly_energy_fixed_cost_last_period'') }} |

        | **Total** | **{{ total(''sensor.daily_power_cost'', ''sensor.daily_gas_cost'',
        ''sensor.daily_energy_fixed_cost'') }}** | **{{ total(''sensor.monthly_power_cost'',
        ''sensor.monthly_gas_cost'', ''sensor.monthly_energy_fixed_cost'') }}** |
        **{{ total(''sensor.monthly_power_cost_last_period'', ''sensor.monthly_gas_cost_last_period'',
        ''sensor.monthly_energy_fixed_cost_last_period'') }}** |


        Used today: {{ states(''sensor.daily_power'') | float(0) | round(1) }} kWh
        power, {{ states(''sensor.daily_gas'') | float(0) | round(2) }} m³ gas.'
      grid_options:
        columns: full
      type: markdown
    type: grid
  - cards:
    - badges:
      - entity: sensor.bizzylectric_range
        show_icon: true
        show_state: true
        type: entity
      - entity: device_tracker.bizzylectric_location_tracker
        show_icon: true
        show_state: true
        type: entity
      heading: Bizzylectric
      heading_style: title
      icon: mdi:car-electric
      type: heading
    - entity: sensor.bizzylectric_battery
      features:
      - max: 100
        min: 0
        type: bar-gauge
      grid_options:
        columns: 6
      name: Battery
      type: tile
    - entity: sensor.bizzylectric_charger_power
      features:
      - hours_to_show: 24
        type: trend-graph
      grid_options:
        columns: 6
      icon: mdi:ev-station
      name: Charging power
      type: tile
    - entity: switch.bizzylectric_charger
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      name: Charger
      tap_action:
        action: toggle
      type: tile
    - entity: lock.bizzylectric_doors
      features:
      - type: lock-commands
      grid_options:
        columns: 6
      name: Doors
      type: tile
    - entity: number.bizzylectric_charging_amps
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
      name: Charging amps
      type: tile
    - entity: number.bizzylectric_charge_limit
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
      name: Charge limit
      type: tile
    - entity: script.electric_vehicle_charging_set_amps_link_to_excess_solar
      grid_options:
        columns: 12
      icon: mdi:solar-power
      name: Charge on excess solar
      tap_action:
        action: toggle
      type: tile
    type: grid
  - cards:
    - heading: Security
      heading_style: title
      icon: mdi:shield-home
      type: heading
    - entity: alarm_control_panel.bunderhome_alarm
      features:
      - modes:
        - armed_home
        - armed_away
        - disarmed
        type: alarm-modes
      grid_options:
        columns: 12
      name: Alarm
      type: tile
    - entity: binary_sensor.openclose_front_door
      grid_options:
        columns: 6
      name: Front door
      state_content:
      - state
      - last_changed
      type: tile
    - entity: binary_sensor.openclose_back_door
      grid_options:
        columns: 6
      name: Back door
      state_content:
      - state
      - last_changed
      type: tile
    - entity: binary_sensor.openclose_living_room_door
      grid_options:
        columns: 6
      name: Living room door
      state_content:
      - state
      - last_changed
      type: tile
    - entity: binary_sensor.openclose_storage_door
      grid_options:
        columns: 6
      name: Storage door
      state_content:
      - state
      - last_changed
      type: tile
    - camera_view: auto
      entity: camera.front_door_snapshot
      grid_options:
        columns: 4
      name: Front door
      show_state: false
      type: picture-entity
    - camera_view: auto
      entity: camera.front_garden_snapshot
      grid_options:
        columns: 4
      name: Front garden
      show_state: false
      type: picture-entity
    - camera_view: auto
      entity: camera.porch_snapshot
      grid_options:
        columns: 4
      name: Porch
      show_state: false
      type: picture-entity
    type: grid
  - cards:
    - heading: Vacuum & appliances
      heading_style: title
      icon: mdi:robot-vacuum
      type: heading
    - entity: vacuum.robot_vacuum
      features:
      - commands:
        - start_pause
        - stop
        - return_home
        - locate
        type: vacuum-commands
      grid_options:
        columns: 12
      name: Vacuum
      state_content:
      - state
      - status
      type: tile
    - color: red
      entity: binary_sensor.robot_vacuum_water_shortage
      grid_options:
        columns: 12
      icon: mdi:water-alert
      name: Water tank empty
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.robot_vacuum_water_shortage
        state: 'on'
    - entity: binary_sensor.vacuum_day
      grid_options:
        columns: 4
      name: Vacuum day
      type: tile
    - entity: input_boolean.cleaned_today
      grid_options:
        columns: 4
      hold_action:
        action: more-info
      name: Cleaned today
      tap_action:
        action: toggle
      type: tile
    - entity: sensor.living_room_robot_vacuum_battery
      grid_options:
        columns: 4
      name: Battery
      type: tile
    - cards:
      - calibration_source:
          camera: true
        entity: vacuum.robot_vacuum
        icons: []
        map_locked: true
        map_modes:
        - template: vacuum_clean_zone
        - template: vacuum_goto
        - predefined_selections:
          - icon:
              name: mdi:stairs
              x: 17750
              y: 31500
            id: '1'
            label:
              offset_y: 35
              text: Hall
              x: 17750
              y: 31500
            outline:
            - - 16200
              - 30200
            - - 21900
              - 30200
            - - 21900
              - 33750
            - - 16200
              - 33750
          - icon:
              name: mdi:cupboard
              x: 23975
              y: 35000
            id: '16'
            label:
              offset_y: 35
              text: Storage
              x: 23975
              y: 35000
            outline:
            - - 22000
              - 33800
            - - 25950
              - 33800
            - - 25950
              - 35950
            - - 22000
              - 35950
          - icon:
              name: mdi:sofa
              x: 21500
              y: 28025
            id: '17'
            label:
              offset_y: 35
              text: Living room
              x: 21500
              y: 28025
            outline:
            - - 16350
              - 25100
            - - 26150
              - 25100
            - - 26150
              - 28450
            - - 24500
              - 28450
            - - 23800
              - 29200
            - - 23800
              - 30200
            - - 16350
              - 30200
          - icon:
              name: mdi:pot-mix
              x: 24025
              y: 32525
            id: '18'
            label:
              offset_y: 35
              text: Kitchen
              x: 24025
              y: 32525
            outline:
            - - 21900
              - 30200
            - - 23800
              - 30200
            - - 23800
              - 29200
            - - 24500
              - 28450
            - - 26150
              - 28450
            - - 26150
              - 30200
            - - 25500
              - 30200
            - - 25500
              - 33800
            - - 21900
              - 33800
          template: vacuum_clean_segment
        map_source:
          camera: camera.xiaomi_cloud_map_extractor
        tiles: []
        two_finger_pan: false
        type: custom:xiaomi-vacuum-map-card
      grid_options:
        columns: full
      title: Vacuum map
      type: custom:collapsable-cards
    - cards:
      - cards:
        - entity: sensor.robot_vacuum_filter_left
          name: Filter
          type: tile
        - entity: sensor.robot_vacuum_main_brush_left
          name: Main brush
          type: tile
        - entity: sensor.robot_vacuum_side_brush_left
          name: Side brush
          type: tile
        - entity: sensor.robot_vacuum_sensor_dirty_left
          name: Sensors
          type: tile
        columns: 2
        square: false
        type: grid
      grid_options:
        columns: full
      title: Vacuum maintenance
      type: custom:collapsable-cards
    - heading: Appliances
      heading_style: subtitle
      type: heading
    - entity: binary_sensor.washing_machine
      grid_options:
        columns: 6
      name: Washing machine
      state_content:
      - state
      - last_changed
      type: tile
    - entity: sensor.washing_machine_remaining_time
      grid_options:
        columns: 6
      icon: mdi:timer-sand
      name: Washer remaining
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.washing_machine
        state: 'on'
    - entity: switch.espresso_machine
      grid_options:
        columns: 6
      hold_action:
        action: more-info
      icon: mdi:coffee-maker
      name: Espresso machine
      state_content:
      - state
      - last_changed
      tap_action:
        action: toggle
      type: tile
    - entity: sensor.espresso_machine_power
      grid_options:
        columns: 6
      icon: mdi:flash
      name: Espresso power
      type: tile
      visibility:
      - condition: state
        entity: binary_sensor.espresso_machine
        state: 'on'
    type: grid
  - cards:
    - heading: Schedule
      heading_style: title
      icon: mdi:calendar-clock
      type: heading
    - entity: schedule.alarm_clock_schedule
      grid_options:
        columns: 12
      icon: mdi:alarm
      name: Alarm clock
      state_content:
      - state
      - next_event
      type: tile
    - color: amber
      entity: sensor.limburg_net_morgen
      grid_options:
        columns: 12
      icon: mdi:trash-can
      name: Trash tomorrow
      type: tile
      visibility:
      - condition: state
        entity: sensor.limburg_net_morgen
        state_not: Geen
    - entity: sensor.limburg_net_gft
      grid_options:
        columns: 6
      icon: mdi:trash-can-outline
      name: GFT
      type: tile
      visibility:
      - condition: state
        entity: sensor.limburg_net_gft
        state_not: unavailable
    - entity: sensor.limburg_net_pmd
      grid_options:
        columns: 6
      icon: mdi:trash-can-outline
      name: PMD
      type: tile
      visibility:
      - condition: state
        entity: sensor.limburg_net_pmd
        state_not: unavailable
    - entity: sensor.limburg_net_restafval
      grid_options:
        columns: 6
      icon: mdi:trash-can-outline
      name: Restafval
      type: tile
      visibility:
      - condition: state
        entity: sensor.limburg_net_restafval
        state_not: unavailable
    - entity: sensor.limburg_net_papier
