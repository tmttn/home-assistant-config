    - slug: night_mode_
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: Security
    - slug: security
  - template: automation_template
    type: custom:decluttering-card
    variables:
    - name: System
    - slug: system_
  - template: automation_template
    type: custom:decluttering-card
    variables:
