---
kiosk_mode:
  admin_settings:
    hide_sidebar: false
  mobile_settings:
    hide_menubutton: true
    hide_overflow: true
  non_admin_settings:
    hide_sidebar: true
title: Bunderhome
views:
- badges: []
  cards:
  - card_mod:
      style: "ha-card {\n  background: transparent;\n  border: none;\n  --card-primary-font-size:\
        \ 24px;\n  --card-secondary-font-size: 14px;\n}\n"
    icon: '{% set hour = now().hour %} {% if hour < 6 %}mdi:weather-night {% elif
      hour < 12 %}mdi:weather-sunset-up {% elif hour < 18 %}mdi:white-balance-sunny
      {% else %}mdi:weather-sunset-down{% endif %}'
    icon_color: '{% set hour = now().hour %} {% if hour < 6 %}deep-purple {% elif
      hour < 12 %}amber {% elif hour < 18 %}yellow {% else %}orange{% endif %}'
    layout: horizontal
    primary: '{% set hour = now().hour %} {% if hour < 6 %}Goedenacht{% elif hour
      < 12 %}Goedemorgen{% elif hour < 18 %}Goedemiddag{% else %}Goedenavond{% endif
      %}!'
    secondary: '{{ states(''weather.home'') | replace(''_'', '' '') | capitalize }}
      · {{ state_attr(''weather.home'', ''temperature'') }}°C'
    tap_action:
      action: more-info
      entity: weather.home
    type: custom:mushroom-template-card
  - alignment: center
    chips:
    - content_info: none
      entity: person.tom
      tap_action:
        action: more-info
      type: entity
      use_entity_picture: true
    - content_info: none
      entity: person.tanja
      tap_action:
        action: more-info
      type: entity
      use_entity_picture: true
    - chip:
        content: Guests
        icon: mdi:account-group
        icon_color: cyan
        type: template
      conditions:
      - entity: input_boolean.guest_mode
        state: 'on'
      type: conditional
    - type: spacer
    - entity: alarm_control_panel.bunderhome_alarm
      icon: '{% if is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_away'')
        %}mdi:shield-lock {% elif is_state(''alarm_control_panel.bunderhome_alarm'',
        ''armed_home'') %}mdi:shield-home {% else %}mdi:shield-off{% endif %}'
      icon_color: '{% if is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_away'')
        %}red {% elif is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_home'')
        %}orange {% else %}green{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/security
      type: template
    type: custom:mushroom-chips-card
  - card:
      card_mod:
        style: "ha-card {\n  background: rgba(244, 67, 54, 0.15);\n  border: 1px solid\
          \ rgba(244, 67, 54, 0.3);\n}\n"
      icon: mdi:door-open
      icon_color: red
      layout: horizontal
      primary: ⚠️ Door open
      secondary: '{% set doors = [] %} {% if is_state(''binary_sensor.openclose_front_door'',
        ''on'') %}{% set doors = doors + [''Front''] %}{% endif %} {% if is_state(''binary_sensor.openclose_back_door'',
        ''on'') %}{% set doors = doors + [''Back''] %}{% endif %} {% if is_state(''binary_sensor.openclose_storage_door'',
        ''on'') %}{% set doors = doors + [''Storage''] %}{% endif %} {{ doors | join('',
        '') }}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/security
      type: custom:mushroom-template-card
    conditions:
    - condition: or
      conditions:
      - entity: binary_sensor.openclose_front_door
        state: 'on'
      - entity: binary_sensor.openclose_back_door
        state: 'on'
      - entity: binary_sensor.openclose_storage_door
        state: 'on'
    type: conditional
  - cards:
    - card_mod:
        style: 'ha-card { background: transparent; }

          '
      icon: '{% set power = states(''sensor.p1_meter_active_power'') | float(0) %}
        {% if power < 0 %}mdi:solar-power{% else %}mdi:flash{% endif %}'
      icon_color: '{% set power = states(''sensor.p1_meter_active_power'') | float(0)
        %} {% if power < 0 %}green {% elif power < 2000 %}blue {% elif power < 5000
        %}orange {% else %}red{% endif %}'
      layout: vertical
      primary: '{% set power = states(''sensor.p1_meter_active_power'') | float(0)
        %} {% if power < 0 %}{{ (power | abs / 1000) | round(1) }} kW{% else %}{{
        (power / 1000) | round(1) }} kW{% endif %}'
      secondary: '{% set power = states(''sensor.p1_meter_active_power'') | float(0)
        %} {% if power < 0 %}Exporting{% else %}Using{% endif %}'
      tap_action:
        action: more-info
        entity: sensor.p1_meter_active_power
      type: custom:mushroom-template-card
    - card_mod:
        style: 'ha-card { background: transparent; }

          '
      icon: '{% set battery = states(''sensor.bizzylectric_battery_level'') | float(0)
        %} {% if is_state(''sensor.bizzylectric_charging'', ''charging'') %}mdi:battery-charging
        {% elif battery > 80 %}mdi:battery-high {% elif battery > 40 %}mdi:battery-medium
        {% else %}mdi:battery-low{% endif %}'
      icon_color: '{% set battery = states(''sensor.bizzylectric_battery_level'')
        | float(0) %} {% if is_state(''sensor.bizzylectric_charging'', ''charging'')
        %}green {% elif battery > 80 %}green {% elif battery > 50 %}blue {% elif battery
        > 20 %}orange {% else %}red{% endif %}'
      layout: vertical
      primary: '{{ states(''sensor.bizzylectric_battery_level'') | round(0) }}%'
      secondary: '{% if is_state(''sensor.bizzylectric_charging'', ''charging'') %}Charging
        {% else %}{{ states(''sensor.bizzylectric_ideal_battery_range'') | round(0,
        default=''?'') }} km{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/ev
      type: custom:mushroom-template-card
    - card_mod:
        style: 'ha-card { background: transparent; }

          '
      icon: mdi:solar-panel
      icon_color: '{% set solar = states(''sensor.sb3_0_1av_41_570_grid_power'') |
        float(0) %} {% if solar > 1000 %}amber {% elif solar > 100 %}yellow {% else
        %}disabled{% endif %}'
      layout: vertical
      primary: '{{ states(''sensor.sb3_0_1av_41_570_grid_power'') | round(0) }} W'
      secondary: Solar
      tap_action:
        action: more-info
        entity: sensor.sb3_0_1av_41_570_grid_power
      type: custom:mushroom-template-card
    mode: horizontal
    type: custom:stack-in-card
  - card:
      card_mod:
        style: "ha-card {\n  background: rgba(255, 193, 7, 0.1);\n  border: 1px solid\
          \ rgba(255, 193, 7, 0.2);\n}\n"
      icon: '{% set val = states(''sensor.limburg_net_morgen'') %} {% if val == ''GFT''
        %}mdi:leaf {% elif val == ''PMD'' %}mdi:recycle {% elif val == ''Restafval''
        %}mdi:trash-can {% elif val == ''Papier'' %}mdi:newspaper {% else %}mdi:trash-can-outline{%
        endif %}'
      icon_color: '{% set val = states(''sensor.limburg_net_morgen'') %}

        {% if val == ''GFT'' %}green

        {% elif val == ''PMD'' %}blue

        {% elif val == ''Restafval'' %}grey

        {% elif val == ''Papier'' %}amber

        {% else %}disabled{% endif %}'
      layout: horizontal
      primary: 🗑️ Tomorrow
      secondary: '{{ states(''sensor.limburg_net_morgen'') }}'
      type: custom:mushroom-template-card
    conditions:
    - entity: sensor.limburg_net_morgen
      state_not: Geen
    type: conditional
  - alignment: left
    subtitle: Climate
    title: ''
    type: custom:mushroom-title-card
  - alignment: center
    chips:
    - content: '{{ state_attr(''climate.living_room'', ''current_temperature'') |
        round(1) }}°'
      entity: climate.living_room
      icon: mdi:sofa
      icon_color: '{% set temp = state_attr(''climate.living_room'', ''current_temperature'')
        | float(20) %} {% if temp < 18 %}blue{% elif temp < 21 %}cyan{% elif temp
        < 23 %}green{% else %}orange{% endif %}'
      tap_action:
        action: more-info
      type: template
    - content: '{{ state_attr(''climate.kitchen'', ''current_temperature'') | round(1)
        }}°'
      entity: climate.kitchen
      icon: mdi:pot-steam
      icon_color: '{% set temp = state_attr(''climate.kitchen'', ''current_temperature'')
        | float(20) %} {% if temp < 18 %}blue{% elif temp < 21 %}cyan{% elif temp
        < 23 %}green{% else %}orange{% endif %}'
      tap_action:
        action: more-info
      type: template
    - content: '{{ states(''sensor.temperature_bedroom'') | round(1) }}°'
      entity: climate.bedroom
      icon: mdi:bed
      icon_color: '{% set temp = states(''sensor.temperature_bedroom'') | float(20)
        %} {% if temp < 17 %}blue{% elif temp < 19 %}cyan{% elif temp < 21 %}green{%
        else %}orange{% endif %}'
      tap_action:
        action: more-info
      type: template
    - content: '{{ states(''sensor.temperature_bedroom_marthe'') | round(1) }}°'
      entity: climate.bedroom_marthe
      icon: mdi:teddy-bear
      icon_color: pink
      tap_action:
        action: more-info
      type: template
    - content: '{% set temp = states(''sensor.bunderhome_weerstation_ws_2902c_temp'')
        %} {% if temp not in [''unavailable'', ''unknown''] %}{{ temp | float | round(1)
        }}°{% else %}—{% endif %}'
      entity: sensor.bunderhome_weerstation_ws_2902c_temp
      icon: mdi:tree
      icon_color: green
      tap_action:
        action: more-info
      type: template
    type: custom:mushroom-chips-card
  - alignment: left
    subtitle: Rooms
    title: ''
    type: custom:mushroom-title-card
  - cards:
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.living_room_lights
      icon: mdi:sofa
      icon_color: '{% if is_state(''light.living_room_lights'', ''on'') %}amber {%
        elif is_state(''binary_sensor.activity_in_living_room'', ''on'') %}blue {%
        else %}disabled{% endif %}'
      layout: vertical
      primary: Living room
      secondary: '{{ state_attr(''climate.living_room'', ''current_temperature'')
        | round(1) }}° ·  {% if is_state(''light.living_room_lights'', ''on'') %}Lights
        on{% else %}Lights off{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/living-room
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.kitchen_lights
      icon: mdi:pot-steam
      icon_color: '{% if is_state(''light.kitchen_lights'', ''on'') %}amber

        {% elif is_state(''binary_sensor.activity_in_kitchen'', ''on'') %}blue

        {% else %}disabled{% endif %}'
      layout: vertical
      primary: Kitchen
      secondary: '{{ state_attr(''climate.kitchen'', ''current_temperature'') | round(1)
        }}° ·  {% if is_state(''binary_sensor.espresso_machine'', ''on'') %}☕{% else
        %}Idle{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/kitchen
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:archive
      icon_color: '{% if is_state(''binary_sensor.activity_in_storage'', ''on'') %}blue
        {% else %}disabled{% endif %}'
      layout: vertical
      primary: Storage
      secondary: '{{ state_attr(''climate.storage'', ''current_temperature'') | round(1)
        }}° ·  {% if is_state(''binary_sensor.openclose_storage_door'', ''on'') %}🚪
        Open{% else %}Closed{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/storage
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.toilet
      icon: mdi:toilet
      icon_color: '{% if is_state(''light.toilet'', ''on'') %}amber {% elif is_state(''binary_sensor.motion_sensor_toilet'',
        ''on'') %}blue {% else %}disabled{% endif %}'
      layout: vertical
      primary: Toilet
      secondary: '{% if is_state(''light.toilet'', ''on'') %}Lights on{% else %}Lights
        off{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/toilet
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:stairs
      icon_color: '{% if is_state(''binary_sensor.activity_in_hall'', ''on'') %}blue
        {% else %}disabled{% endif %}'
      layout: vertical
      primary: Hall
      secondary: '{{ state_attr(''climate.hall'', ''current_temperature'') | round(1)
        }}° ·  {% if is_state(''binary_sensor.openclose_front_door'', ''on'') %}🚪
        Open{% else %}Closed{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/hall
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.bathroom_lights
      icon: mdi:shower-head
      icon_color: '{% if is_state(''light.bathroom_lights'', ''on'') %}amber {% elif
        is_state(''switch.shelly_bathroom'', ''on'') %}deep-orange {% elif is_state(''binary_sensor.activity_in_bathroom'',
        ''on'') %}blue {% else %}disabled{% endif %}'
      layout: vertical
      primary: Bathroom
      secondary: '{{ states(''sensor.temperature_bathroom'') | round(1) }}° ·  {%
        if is_state(''switch.shelly_bathroom'', ''on'') %}🔥{% endif %} {% if is_state(''light.bathroom_lights'',
        ''on'') %}Lights on{% else %}Off{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/bathroom
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.bedroom_lights
      icon: mdi:bed-king
      icon_color: '{% if is_state(''light.bedroom_lights'', ''on'') %}amber

        {% elif not is_state(''input_select.sleep_mode'', ''off'') %}deep-purple

        {% else %}disabled{% endif %}'
      layout: vertical
      primary: Bedroom
      secondary: '{{ states(''sensor.temperature_bedroom'') | round(1) }}° ·  {% if
        not is_state(''input_select.sleep_mode'', ''off'') %}💤{% endif %} {% if is_state(''light.bedroom_lights'',
        ''on'') %}Lights on{% else %}Off{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/bedroom
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.guest_bedroom_lights
      icon: mdi:bed-double
      icon_color: '{% if is_state(''light.guest_bedroom_lights'', ''on'') %}amber
        {% elif is_state(''binary_sensor.activity_in_guest_bedroom'', ''on'') %}blue
        {% else %}disabled{% endif %}'
      layout: vertical
      primary: Guest room
      secondary: '{{ states(''sensor.temperature_guest_bedroom'') | round(1) }}° ·  {%
        if is_state(''binary_sensor.activity_in_guest_bedroom'', ''on'') %}Occupied{%
        else %}Empty{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/guest-bedroom
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:teddy-bear
      icon_color: pink
      layout: vertical
      primary: Marthe
      secondary: '{{ states(''sensor.temperature_bedroom_marthe'') | round(1) }}°'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/marthe-bedroom
      type: custom:mushroom-template-card
    - fill_container: true
      hold_action:
        action: toggle
        entity: light.outside_lights
      icon: mdi:tree
      icon_color: '{% if is_state(''light.outside_lights'', ''on'') %}amber {% else
        %}green{% endif %}'
      layout: vertical
      primary: Outside
      secondary: '{% set temp = states(''sensor.bunderhome_weerstation_ws_2902c_temp'')
        %} {% if temp not in [''unavailable'', ''unknown''] %}{{ temp | float | round(1)
        }}°{% else %}—{% endif %} ·  {% if is_state(''light.outside_lights'', ''on'')
        %}Lights on{% else %}Lights off{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/outside
      type: custom:mushroom-template-card
    columns: 2
    square: false
    type: grid
  - alignment: left
    subtitle: Quick Actions
    title: ''
    type: custom:mushroom-title-card
  - cards:
    - fill_container: true
      icon: mdi:weather-sunset-up
      icon_color: amber
      layout: vertical
      primary: Wake up
      tap_action:
        action: call-service
        data:
          option: 'off'
        service: input_select.select_option
        target:
          entity_id: input_select.sleep_mode
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:weather-night
      icon_color: '{% if not is_state(''input_select.sleep_mode'',''off'') %}purple

        {% else %}deep-purple{% endif %}'
      layout: vertical
      primary: '{% if not is_state(''input_select.sleep_mode'',''off'') %}Sleep mode
        on {% else %}Go to sleep{% endif %}'
      tap_action:
        action: call-service
        service: script.going_to_sleep
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:home-import-outline
      icon_color: green
      layout: vertical
      primary: Arrive
      tap_action:
        action: call-service
        service: script.arriving
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:home-export-outline
      icon_color: blue
      layout: vertical
      primary: Leave
      tap_action:
        action: call-service
        service: script.leaving
      type: custom:mushroom-template-card
    columns: 2
    square: false
    type: grid
  - entity: input_boolean.guest_mode
    icon: mdi:account-multiple
    icon_color: '{% if is_state(''input_boolean.guest_mode'', ''on'') %}cyan{% else
      %}disabled{% endif %}'
    layout: horizontal
    name: Guest mode
    tap_action:
      action: toggle
    type: custom:mushroom-entity-card
  - cards:
    - fill_container: true
      icon: mdi:shield-home
      icon_color: '{% if is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_away'')
        %}red {% elif is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_home'')
        %}orange {% else %}green{% endif %}'
      layout: vertical
      primary: Security
      secondary: '{% if is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_away'')
        %}Armed away {% elif is_state(''alarm_control_panel.bunderhome_alarm'', ''armed_home'')
        %}Armed home {% else %}Disarmed{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/security
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:lightning-bolt
      icon_color: '{% set power = states(''sensor.p1_meter_active_power'') | float(0)
        %} {% if power < 0 %}green{% else %}amber{% endif %}'
      layout: vertical
      primary: Energy
      secondary: '{% set power = states(''sensor.p1_meter_active_power'') | float(0)
        %} {% if power < 0 %}+{{ (power | abs / 1000) | round(1) }} kW{% else %}{{
        (power / 1000) | round(1) }} kW{% endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/energy
      type: custom:mushroom-template-card
    - fill_container: true
      icon: mdi:tools
      icon_color: '{% set low_batteries = states.sensor | selectattr(''entity_id'',
        ''search'', ''battery'') | selectattr(''state'', ''lt'', ''20'') | list |
        count %} {% if low_batteries > 0 %}orange{% else %}disabled{% endif %}'
      layout: vertical
      primary: Maintenance
      secondary: '{% set low_batteries = states.sensor | selectattr(''entity_id'',
        ''search'', ''battery'') | selectattr(''state'', ''lt'', ''20'') | list |
        count %} {% if low_batteries > 0 %}{{ low_batteries }} low{% else %}All good{%
        endif %}'
      tap_action:
        action: navigate
        navigation_path: /dashboard-mobile/maintenance
      type: custom:mushroom-template-card
    columns: 3
    square: false
    type: grid
  icon: mdi:home
  path: home
  theme: Mushroom
  title: Home
  type: custom:vertical-layout
  visible:
  - user: b64ec45da7a14f57bbcec78e6bb90b50
  - user: 3647a3cda1b843dfa9fa724038fdd82b
  - user: 5ee38b35098341c497a6c7a830742fbe
- back_path: /dashboard-mobile/home
  badges: []
  cards:
  - alignment: center
    chips:
    - type: spacer
    - content: '{{ state_attr(''climate.kitchen'', ''current_temperature'') | round(1)
        }}°C'
      entity: climate.kitchen
      icon: mdi:thermometer
      icon_color: '{% set temp = state_attr(''climate.kitchen'', ''current_temperature'')
        | float(20) %} {% if temp < 18 %}blue{% elif temp < 22 %}green{% elif temp
        < 25 %}orange{% else %}red{% endif %}'
      type: template
    - entity: binary_sensor.openclose_back_door
      icon: mdi:door
      icon_color: '{% if is_state(''binary_sensor.openclose_back_door'', ''on'') %}red{%
        else %}green{% endif %}'
      type: template
    type: custom:mushroom-chips-card
  - alignment: left
    subtitle: '{% if is_state(''binary_sensor.espresso_machine'', ''on'') %}Coffee
      machine on{% else %}All appliances off{% endif %}'
    type: custom:mushroom-title-card
  - collapsible_controls: false
    entity: light.kitchen_lights
    fill_container: true
    layout: vertical
    name: Lights
    show_brightness_control: true
    show_color_temp_control: true
    type: custom:mushroom-light-card
    use_light_color: true
  - entity: climate.kitchen
    type: thermostat
  - alignment: left
    subtitle: Appliances
    title: ''
    type: custom:mushroom-title-card
  - cards:
    - entity: switch.espresso_machine
      fill_container: true
      icon: mdi:coffee-maker
      icon_color: '{% if is_state(''switch.espresso_machine'', ''on'') %}amber{% else
        %}disabled{% endif %}'
      layout: vertical
      name: Espresso
      tap_action:
        action: toggle
      type: custom:mushroom-entity-card
    columns: 2
    square: false
    type: grid
  icon: mdi:pot-steam
  path: kitchen
  subview: true
  theme: Mushroom
  title: Kitchen
  visible:
  - user: b64ec45da7a14f57bbcec78e6bb90b50
  - user: 5ee38b35098341c497a6c7a830742fbe
  - user: 3647a3cda1b843dfa9fa724038fdd82b
- back_path: /dashboard-mobile/home
  badges: []
  cards:
  - alignment: left
    subtitle: '{% if is_state(''light.living_room_lights'', ''on'') %}Lights on{%
      else %}Lights off{% endif %} ·  {% if is_state(''binary_sensor.activity_in_living_room'',
      ''on'') %}Occupied{% else %}Empty{% endif %}'
    type: custom:mushroom-title-card
  - alignment: center
    chips:
    - type: spacer
    - content: '{{ state_attr(''climate.living_room'', ''current_temperature'') |
        round(1) }}°C'
      entity: climate.living_room
      icon: mdi:thermometer
      icon_color: '{% set temp = state_attr(''climate.living_room'', ''current_temperature'')
        | float(20) %} {% if temp < 18 %}blue{% elif temp < 22 %}green{% elif temp
        < 25 %}orange{% else %}red{% endif %}'
      type: template
    - entity: binary_sensor.activity_in_living_room
      icon: mdi:motion-sensor
      icon_color: '{% if is_state(''binary_sensor.activity_in_living_room'', ''on'')
        %}amber{% else %}disabled{% endif %}'
