        type: custom:mushroom-template-card
      - badge_color: '{% set dd = states(''sensor.degree_day_bedroom'') | float(0)
          %}{{ ''red'' if dd >= 0.7 else ''amber'' }}'
        badge_icon: '{% set dd = states(''sensor.degree_day_bedroom'') | float(0)
          %}{{ ''mdi:alert'' if dd >= 0.7 else ''mdi:arrow-down'' if dd >= 0.3 else
          '''' }}'
        entity: sensor.degree_day_bedroom
        fill_container: true
        icon: mdi:bed-king
        icon_color: '{% set dd = states(''sensor.degree_day_bedroom'') | float(0)
          %}{% set sp = state_attr(''climate.bedroom'', ''temperature'') | float(0)
          %}{{ ''red'' if dd >= 0.7 else ''amber'' if dd >= 0.3 else ''grey'' if (is_state(''climate.bedroom'',
          ''off'') or sp <= 7) else ''green'' }}'
        layout: vertical
