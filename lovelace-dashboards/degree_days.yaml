  - cards:
    - heading: How to read this page
      heading_style: title
      icon: mdi:help-circle-outline
      type: heading
    - content: '**House degree days (DD)** describe the weather: 18 °C minus the day''s
        average outdoor temperature, never below 0. Zero means no heating needed,
        around 10 is an ordinary cold day, 15 or more is a cold snap.


        **Room shortfall (°C)** describes the heating: how far a room stayed *below
        its own setpoint*, averaged over the day. Heating off (5 °C frost setpoint)
        reads 0.


        **Why under 0.3 °C is fine:** a thermostat turns the radiator on just below
        the setpoint and off just above it, so a room swings about 1 °C around its
        target. Averaged over a day, that swing alone leaves 0.1–0.3 °C of shortfall.


        **When to act:** a day average of 0.7 °C or more (especially two days running),
        or a room that stays more than 1 °C under its setpoint for over an hour. *What
        to do now* at the top lists these for you.'
      grid_options:
        columns: full
      type: markdown
    column_span: 1
    type: grid
  - cards:
    - heading: Last 30 complete days
      heading_style: title
      icon: mdi:chart-bar
      type: heading
    - content: '**Read the top two charts side by side:** left is how cold each day
        was, right is how well the rooms kept up. Room bars that **grow on cold days**
        mean the heating can''t keep up in the cold: start it earlier or raise the
        flow temperature. Room bars on **mild days** point at a local problem such
        as a stuck valve, a flat TRV battery or a schedule gap. A room that falls
        short but is **barely used** (bottom charts) is usually fine.

        Today is left out until it is complete; see the tiles above. House DD and
        weighted shortfall are logged once a day at 23:59. Hover a bar for exact values;
        click a room in a legend to hide it.'
      grid_options:
        columns: full
      text_only: true
      type: markdown
    - cards:
      - content: '**House degree days** · how cold each day was

          Taller bar = more heat needed. Grey because it describes the weather, not
          a room.'
        text_only: true
        type: markdown
      - content: '**Room shortfall** · °C below setpoint, day average

          One segment per room, stacked. A tall bar means several rooms fell short
          that day.'
        text_only: true
        type: markdown
