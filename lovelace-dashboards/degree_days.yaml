        badge_icon: '{% set dd = states(''sensor.degree_day_guest_bedroom'') | float(0)
          %}{{ ''mdi:alert'' if dd >= 0.7 else ''mdi:arrow-down'' if dd >= 0.3 else
          '''' }}'
