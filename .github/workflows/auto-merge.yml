name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependency bots, plus non-draft PRs that the repository owner both
    # opened and last pushed to, from a branch in this repository (Claude
    # Code sessions open and push under that account too). Checking the
    # actor as well as the author keeps a push by anyone else to an
    # owner-opened PR from being approved. The merge itself still waits for
    # the ruleset's required status checks.
    if: >-
      github.actor == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    steps:
      - uses: hmarr/auto-approve-action@v4
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
