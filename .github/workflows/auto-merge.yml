name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # Dispatch the deploy after the merge (see the last step).
  actions: write

# A new push to the PR replaces the run that is still waiting for the merge.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependency bots, plus non-draft PRs that the repository owner both
    # opened and last pushed to, from a branch in this repository (Claude
    # Code sessions open and push under that account too). Checking the
    # actor as well as the author keeps a push by anyone else to an
    # owner-opened PR from being approved. The merge itself still waits for
    # the ruleset's required status checks.
    if: >-
      github.actor == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    steps:
      - uses: hmarr/auto-approve-action@v4
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Auto-merge enabled with GITHUB_TOKEN merges as github-actions[bot],
      # and GitHub starts no workflow runs for a push made with GITHUB_TOKEN:
      # the push to main never runs "Deploy to Home Assistant". A
      # workflow_dispatch is exempt from that rule, so wait for the merge
      # here and dispatch the deploy explicitly.
      - name: Deploy once merged
        timeout-minutes: 35
        run: |
          for _ in $(seq 1 120); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED)
                gh workflow run deploy-ha.yml --repo "$GITHUB_REPOSITORY" --ref main
                echo "Merged; dispatched Deploy to Home Assistant"
                exit 0
                ;;
              CLOSED)
                echo "Closed without merging; nothing to deploy"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::warning::Not merged within 30 minutes; no deploy dispatched"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
