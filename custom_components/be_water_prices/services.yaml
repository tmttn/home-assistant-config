refresh:
  name: Refresh tariff
  description: >
    Fetch the utility's tariff again now instead of at the next daily
    refresh. The call returns once the fetches are done, so an
    automation step after it reads the new figures.
  fields:
    entry_id:
      name: Config entry
      description: >
        Optional. The config entry to refresh. Leave empty to refresh
        every loaded entry.
      example: 01H8WZK0WZK0WZK0WZK0WZK0WZ
      selector:
        config_entry:
          integration: be_water_prices
backfill_prices:
  name: Backfill price history
  description: >
    Import flat-line hourly long-term-statistics rows for this
    integration's price sensors so the History and Energy dashboards
    show a tariff line going back further than the install date. The
    run is automatic on the entry's first setup, and again whenever the
    calendar year, the operator, the year of the card the rates came off
    or the commune changes; this service lets you re-trigger it on demand
    or extend it to an earlier start date. Only an administrator can run
    it.
  fields:
    entry_id:
      name: Config entry
      description: >
        Optional. The config entry to backfill (e.g. one specific
        utility). Leave empty to backfill every loaded entry. Required
        when "Clear before importing" is on.
      example: 01H8WZK0WZK0WZK0WZK0WZK0WZ
      selector:
        config_entry:
          integration: be_water_prices
    start_date:
      name: Start date
      description: >
        Optional. Earliest date to backfill. Defaults to 1 January of
        the current year. The effective start is clamped to the tariff
        snapshot's valid_from so we never invent prices for periods
        with no source.
      example: "2026-01-01"
      selector:
        date:
    clear:
      name: Clear before importing
      description: >
        If on, delete the targeted sensors' long-term statistics
        entirely before importing -- every year of them, not just the
        window being re-imported, because the recorder only deletes a
        statistic whole. Anything older than the start date above is
        gone and is not written back. Off by default, which overwrites
        the window and leaves the rest alone; that is enough to correct
        a wrong tariff value. Requires a config entry above, since
        clearing every loaded entry at once is irreversible.
      default: false
      selector:
        boolean:
bill_cost:
  name: Bill cost
  description: >
    Price a volume of water drawn over a closed run of days the way the
    year's cost is priced, to hold a utility's bill against. Each day is
    billed on the card in force that day. Only answers, and only an
    administrator can run it.
  fields:
    entry_id:
      name: Config entry
      description: The config entry whose tariff and household are used.
      required: true
      example: 01H8WZK0WZK0WZK0WZK0WZK0WZ
      selector:
        config_entry:
          integration: be_water_prices
    start:
      name: Start date
      description: >
        The first day billed. No earlier than 1 January two years back.
      required: true
      example: "2025-11-20"
      selector:
        date:
    end:
      name: End date
      description: The last day billed, before today.
      required: true
      example: "2026-11-18"
      selector:
        date:
    volume:
      name: Volume
      description: The m³ the bill charges over those days.
      required: true
      example: 174
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
          unit_of_measurement: m³
