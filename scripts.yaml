start_spotify_playlist_of_nearest_person:
  alias: Start Spotify
  description: Start a Spotify playlist on Google Home speakers
  fields:
    entity_id:
      description: entity_id of the speaker
      example: media_player.google_home
  sequence:
  - data:
      uri: 'spotify:playlist:{{ states("sensor.favorite_playlist_of_nearest_person")
        }}

        '
      random_song: true
      shuffle: true
      start_volume: 35
      entity_id: '{{ entity_id }}'
    action: spotcast.start
cozy_lights_living_room:
  alias: Set cozy lights in the living room
  mode: parallel
  sequence:
  - action: light.turn_off
    data:
      transition: 1
    target:
      entity_id:
      - light.living_room_dining_table_lights
      - light.living_room_middle_lights
  - data:
      entity_id: light.hue_plug
      hs_color:
      - 26.667
      - 88.235
    action: light.turn_on
  max: 10
white_lights_living_room:
  alias: Set white lights in the living room
  mode: parallel
  sequence:
  - action: light.turn_on
    data:
      entity_id:
      - light.living_room_lights
      color_temp: 366
  max: 10
increase_brightness:
  alias: Increase the brightness of a group of lights
  mode: parallel
  fields:
    group:
      description: The group to apply the light increase to.
      example: light.living_room_lights
  sequence:
  - action: light.turn_on
    data:
      entity_id: '{{ group }}'
      brightness: "{% set b = state_attr(group, 'brightness') %} {% if b == None or
        b == 0 %}\n  10\n{% elif b < 20 %}\n  128\n{% else %}\n  255\n{% endif %}\n"
turn_off_everything_non_automatic:
  alias: Turn off everything non automatic
  mode: parallel
  sequence:
  - data:
      transition: 4
    target:
      entity_id:
      - light.living_room_lights
      - light.bedroom_lights
      - light.bathroom_lights
      - light.guest_bedroom_lights
      - switch.shelly_kerstboom
    action: light.turn_off
  - entity_id: media_player.tv
    action: media_player.turn_off
  max: 10
turn_off_everything:
  alias: Turn off everything
  mode: parallel
  sequence:
  - action: script.turn_off_everything_non_automatic
  - action: light.turn_off
    entity_id: all
going_to_sleep:
  alias: Going to sleep
  mode: parallel
  sequence:
  - entity_id: input_select.sleep_mode
    action: input_select.select_option
    data:
      option: total
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: script.turn_off_everything_non_automatic
    data: {}
  max: 10
set_low_temperature:
  alias: Set low temperature
  sequence:
  - action: evohome.set_zone_override
    data:
      entity_id: climate.living_room
      setpoint: '{{ states("input_number.temperature_low") }}

        '
  - action: evohome.set_zone_override
    data:
      entity_id: climate.kitchen
      setpoint: '{{ states("input_number.temperature_low") }}

        '
set_moderate_temperature:
  alias: Set moderate temperature
  sequence:
  - action: evohome.set_zone_override
    data:
      entity_id: climate.living_room
      setpoint: '{{ states("input_number.temperature_moderate") }}

        '
  - action: evohome.set_zone_override
    data:
      entity_id: climate.kitchen
      setpoint: '{{ states("input_number.temperature_moderate") }}

        '
set_high_temperature:
  alias: Set high temperature
  sequence:
  - action: evohome.set_zone_override
    data:
      entity_id: climate.living_room
      setpoint: '{{ states("input_number.temperature_high") }}

        '
  - action: evohome.set_zone_override
    data:
      entity_id: climate.kitchen
      setpoint: '{{ states("input_number.temperature_high") }}

        '
leaving:
  alias: Leaving the house
  sequence:
  - action: script.set_low_temperature
  - action: script.turn_off_everything
arriving:
  alias: Arriving home
  sequence:
  - action: script.set_high_temperature
    data: {}
  - action: script.cozy_lights_living_room
    data: {}
  mode: single
turn_on_lights:
  alias: Turn on lights with Adaptive Lighting
  icon: mdi:script-text
  fields:
    entity_id:
      description: entity_id of light
      example: light.bedroom_lights
  sequence:
  - action: adaptive_lighting.apply
    data:
      entity_id: switch.adaptive_lighting_default
      lights: '{{ entity_id }}'
      turn_on_lights: true
  mode: single
reset_adaptive_lighting:
  alias: Reset 'manual control'
  sequence:
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_default
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_half_and_dim
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_half_and_full
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_outside
      manual_control: false
  mode: single
color_loop_bathroom:
  alias: Color loop bathroom
  description: Cycle the bathroom lights through the colour wheel, one full turn per
    minute. Turn the script on to start the loop. It stops when the script is turned
    off or the bathroom lights are switched off. Replaces the old time_pattern automation
    that fired every second.
  icon: mdi:looks
  mode: single
  max_exceeded: silent
  variables:
    colors:
    - - 0.217
      - 0.077
    - - 0.157
      - 0.05
    - - 0.136
      - 0.04
    - - 0.137
      - 0.065
    - - 0.141
      - 0.137
    - - 0.146
      - 0.238
    - - 0.151
      - 0.343
    - - 0.157
      - 0.457
    - - 0.164
      - 0.591
    - - 0.17
      - 0.703
    - - 0.172
      - 0.747
    - - 0.199
      - 0.724
    - - 0.269
      - 0.665
    - - 0.36
      - 0.588
    - - 0.444
      - 0.517
    - - 0.527
      - 0.447
    - - 0.612
      - 0.374
    - - 0.677
      - 0.319
    - - 0.701
      - 0.299
    - - 0.667
      - 0.284
    - - 0.581
      - 0.245
    - - 0.477
      - 0.196
    - - 0.385
      - 0.155
    - - 0.301
      - 0.116
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.bathroom_lights
    data:
      xy_color: '{{ colors[0] }}'
  - repeat:
      while:
      - condition: state
        entity_id: light.bathroom_lights
        state: 'on'
      sequence:
      - repeat:
          for_each: '{{ colors }}'
          sequence:
          - condition: state
            entity_id: light.bathroom_lights
            state: 'on'
            note: Skip the rest of the turn once the lights are off.
          - action: light.turn_on
            target:
              entity_id: light.bathroom_lights
            data:
              xy_color: '{{ repeat.item }}'
              transition: 2
          - delay:
              seconds: 2.5
washing_machine_remote_start:
  alias: Washing machine remote start
  description: 'Sends the remote start to the Miele washing machine: miele.set_program
    for Mobile Control (program_id > 0), otherwise button.washing_machine_start. The
    Miele cloud often answers after more than 15 s, so the call raises a TimeoutError
    while the machine still starts; callers run this with script.turn_on (fire and
    forget) and confirm the start themselves via binary_sensor.washing_machine.'
  fields:
    program_id:
      name: Program id
      description: Miele program id for Mobile Control (Delicates 4, Cottons 1); 0
        presses the start button.
      default: 0
      selector:
        number:
          min: 0
          max: 99999
          mode: box
  sequence:
  - if:
    - condition: template
      value_template: '{{ program_id | int(0) > 0 }}'
    then:
    - action: miele.set_program
      data:
        device_id: 8437f5e53ab041fbf2e4db4bd23cb420
        program_id: '{{ program_id | int }}'
    else:
    - action: button.press
      target:
        entity_id: button.washing_machine_start
  mode: single
  icon: mdi:washing-machine
