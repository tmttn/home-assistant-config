# Last month's capacity peak. The P1 monthly peak only rises within a month,
# so a drop means it reset: keep the value from before the drop.
# Seeded with October 2026's invoiced peak (7.68 kW) until the first reset.
- trigger:
    - trigger: state
      entity_id: sensor.p1_meter_peak_demand_current_month
  sensor:
    - name: Power peak demand (Last period)
      unique_id: power_peak_demand_last_period
      unit_of_measurement: kW
      state: >
        {% set prev = this.attributes.get("running_max") %}
        {% set now_w = trigger.to_state.state | float(none) %}
        {% if now_w is not none and prev is not none and now_w < prev %}
          {{ (prev / 1000) | round(2) }}
        {% else %}
          {{ this.state | float(7.68) }}
        {% endif %}
      attributes:
        running_max: >
          {% set now_w = trigger.to_state.state | float(none) %}
          {{ now_w if now_w is not none else this.attributes.get("running_max") }}

# Whole-house degree day (classic: 18°C - outside avg temp)
- trigger:
    platform: time
    at: "23:59:01"
  sensor:
    - name: Degree day daily
      unique_id: degree_day_daily
      state: >
        {% set regularized_temp = 18.0 %}
        {% set avg_outside = states('sensor.outside_temperature_avg') | float(0) %}
        {% set dd = regularized_temp - avg_outside %}
        {{ [dd, 0] | max | round(2) }}
      unit_of_measurement: "DD"
      state_class: measurement

# Per-room degree days: running daily average of max(0, target - current)
# Samples every 15 min, resets at midnight. State = day's average deficit so far.
- trigger:
    platform: time_pattern
    minutes: "/15"
  sensor:
    - name: Degree day living room
      unique_id: degree_day_living_room
      state: >
        {% set target = state_attr('climate.living_room', 'temperature') | float(20) %}
        {% set current = state_attr('climate.living_room', 'current_temperature') | float(target) %}
        {% set deficit = [target - current, 0] | max %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set last_reset = this.attributes.get('last_reset', '') %}
        {% set n = this.attributes.get('samples', 0) | int(0) %}
        {% if last_reset != today or n == 0 %}
          {{ deficit | round(2) }}
        {% else %}
          {{ ((this.state | float(0) * n + deficit) / (n + 1)) | round(2) }}
        {% endif %}
      unit_of_measurement: "DD"
      state_class: measurement
      attributes:
        last_reset: "{{ now().strftime('%Y-%m-%d') }}"
        samples: >
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set last_reset = this.attributes.get('last_reset', '') %}
          {% set n = this.attributes.get('samples', 0) | int(0) %}
          {% if last_reset != today or n == 0 %}1{% else %}{{ n + 1 }}{% endif %}

