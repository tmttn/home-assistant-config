# Per-room degree days adjusted for occupancy: DD * (hours_occupied / 24)
# Excludes bedroom and Marthe's bedroom (no occupancy sensors)
- trigger:
    platform: time
    at: "23:59:30"
  sensor:
    - name: Degree day living room adjusted
      unique_id: degree_day_living_room_adjusted
      state: >
        {% set dd = states('sensor.degree_day_living_room') | float(0) %}
        {% set hours = states('sensor.occupancy_living_room_daily') | float(0) %}
        {% set occupancy_rate = hours / 24 %}
        {{ (dd * occupancy_rate) | round(2) }}
      unit_of_measurement: "DD·O"
      state_class: measurement
      attributes:
        occupancy_hours: "{{ states('sensor.occupancy_living_room_daily') | float(0) | round(1) }}"
        raw_dd: "{{ states('sensor.degree_day_living_room') | float(0) }}"

