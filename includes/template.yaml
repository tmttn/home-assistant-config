      unique_id: vacuum_mode
      state: >
        {{ is_state("vacuum.robot_vacuum", "cleaning")}}
      turn_on:
        - action: vacuum.start
          target:
            entity_id: vacuum.robot_vacuum
      turn_off:
        - action: vacuum.return_to_base
          target:
            entity_id: vacuum.robot_vacuum
